<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Guru AI</title>

<style>
:root{
  --bg:#070707;
  --card:#111111;
  --card2:#161616;
  --gold:#d6a84f;
  --gold2:#f0c86b;
  --text:#f5f5f5;
  --muted:#999;
  --border:#292929;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top,#211806 0%,#0b0b0b 38%,#050505 100%);
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.app{
  max-width:900px;
  margin:auto;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

header{
  height:68px;
  padding:10px 15px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(7,7,7,.88);
  backdrop-filter:blur(15px);
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#f2c867,#9b7024);
  color:#111;
  font-size:22px;
  font-weight:900;
  box-shadow:0 0 25px rgba(214,168,79,.18);
}

.title{
  font-size:20px;
  font-weight:800;
  color:var(--gold2);
}

.subtitle{
  font-size:10px;
  color:#777;
  margin-top:1px;
}

.top-right{
  display:flex;
  align-items:center;
  gap:7px;
}

select,
.icon-btn{
  background:#151515;
  color:#eee;
  border:1px solid #333;
  border-radius:12px;
  padding:9px;
}

.icon-btn{
  width:40px;
  height:40px;
  font-size:17px;
}

/* CHAT */

main{
  flex:1;
  overflow-y:auto;
  padding:20px 14px 125px;
  scroll-behavior:smooth;
}

.welcome{
  text-align:center;
  padding:48px 12px 25px;
}

.welcome-logo{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#f2c867,#8d651f);
  color:#111;
  font-size:38px;
  font-weight:900;
  box-shadow:0 10px 45px rgba(214,168,79,.2);
}

.welcome h1{
  margin:17px 0 7px;
  font-size:31px;
}

.welcome h1 span{
  color:var(--gold2);
}

.welcome p{
  color:#999;
  line-height:1.5;
  font-size:14px;
}

.quick{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-top:20px;
}

.quick button{
  background:#121212;
  border:1px solid #2e2e2e;
  color:#ddd;
  border-radius:20px;
  padding:9px 13px;
  font-size:12px;
}

/* MESSAGES */

.msg{
  max-width:88%;
  margin:12px 0;
  padding:13px 15px;
  border-radius:17px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
  animation:appear .2s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.msg.user{
  margin-left:auto;
  background:#2b2110;
  border:1px solid #5a4319;
}

.msg.ai{
  background:#111;
  border:1px solid #292929;
}

.msg img{
  max-width:100%;
  border-radius:12px;
  margin-top:8px;
}

.sources{
  margin-top:9px;
  padding-top:8px;
  border-top:1px solid #292929;
  font-size:11px;
  color:#888;
}

.sources a{
  display:block;
  color:var(--gold2);
  text-decoration:none;
  margin-top:5px;
}

/* STATUS */

.status{
  position:fixed;
  bottom:72px;
  left:0;
  right:0;
  text-align:center;
  font-size:11px;
  color:#888;
  pointer-events:none;
}

/* COMPOSER */

.composer-wrap{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  background:rgba(7,7,7,.94);
  border-top:1px solid var(--border);
  backdrop-filter:blur(15px);
}

.composer{
  max-width:900px;
  margin:auto;
  padding:9px 10px;
  display:flex;
  gap:7px;
  align-items:flex-end;
}

.circle{
  width:45px;
  height:45px;
  flex-shrink:0;
  border-radius:14px;
  background:#151515;
  color:#ddd;
  border:1px solid #333;
  font-size:20px;
}

textarea{
  flex:1;
  min-height:45px;
  max-height:130px;
  resize:none;
  background:#151515;
  border:1px solid #333;
  border-radius:14px;
  color:white;
  padding:12px;
  font-size:15px;
  outline:none;
}

textarea:focus{
  border-color:#705521;
}

.send{
  width:47px;
  height:45px;
  border-radius:14px;
  border:none;
  background:linear-gradient(145deg,#f0c86b,#b78328);
  color:#111;
  font-size:20px;
  font-weight:900;
}

/* ATTACHMENT MENU */

.attach-menu{
  display:none;
  position:absolute;
  bottom:64px;
  left:10px;
  background:#151515;
  border:1px solid #333;
  border-radius:16px;
  padding:8px;
  box-shadow:0 10px 35px #000;
}

.attach-menu button{
  display:block;
  width:190px;
  text-align:left;
  background:none;
  border:0;
  color:#eee;
  padding:12px;
  border-radius:10px;
}

.attach-menu button:hover{
  background:#222;
}

/* TYPING */

.typing{
  display:inline-flex;
  gap:4px;
}

.typing span{
  width:6px;
  height:6px;
  background:#aaa;
  border-radius:50%;
  animation:b 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes b{
  0%,100%{opacity:.2}
  50%{opacity:1}
}

/* TOAST */

.toast{
  position:fixed;
  top:75px;
  left:50%;
  transform:translateX(-50%);
  background:#191919;
  border:1px solid #3b3b3b;
  color:#eee;
  padding:10px 15px;
  border-radius:12px;
  font-size:12px;
  display:none;
  z-index:100;
}

/* MOBILE */

@media(max-width:600px){

  header{
    height:62px;
  }

  .title{
    font-size:18px;
  }

  .subtitle{
    font-size:9px;
  }

  .logo{
    width:38px;
    height:38px;
    border-radius:12px;
  }

  .welcome{
    padding-top:35px;
  }

  .welcome h1{
    font-size:28px;
  }

  .msg{
    max-width:92%;
  }

  .status{
    bottom:66px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="brand">

    <div class="logo">✦</div>

    <div>
      <div class="title">Guru AI</div>
      <div class="subtitle">Gemini 3.8 • Auto Fallback • Secure</div>
    </div>

  </div>

  <div class="top-right">

    <select id="language">
      <option value="auto">Auto</option>
      <option value="hi">हिंदी</option>
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>

    <button class="icon-btn" id="clearBtn">⌫</button>

  </div>

</header>


<main id="chat">

  <section class="welcome" id="welcome">

    <div class="welcome-logo">✦</div>

    <h1>नमस्ते, <span>Guru AI</span></h1>

    <p>
      आपका AI Assistant<br>
      Mobile Repair • Camera • PDF • Web Search • General AI
    </p>

    <div class="quick">

      <button data-q="मेरे मोबाइल में चार्जिंग नहीं हो रही है, क्या चेक करूं?">
        🔧 Mobile Repair
      </button>

      <button data-q="इस समस्या को आसान हिंदी में समझाओ">
        🧠 Explain
      </button>

      <button data-q="आज की महत्वपूर्ण जानकारी बताओ">
        🌐 Web Search
      </button>

      <button data-q="मेरे लिए एक professional message लिखो">
        ✍️ Writing
      </button>

    </div>

  </section>

</main>


<div class="status" id="status"></div>


<div class="composer-wrap">

  <div class="attach-menu" id="attachMenu">

    <button id="cameraBtn">📷 Camera</button>

    <button id="galleryBtn">🖼️ Photos / Gallery</button>

    <button id="fileBtn">📄 PDF / File</button>

  </div>


  <div class="composer">

    <button class="circle" id="plusBtn">＋</button>

    <textarea
      id="input"
      rows="1"
      placeholder="Guru AI से कुछ पूछें..."
    ></textarea>

    <button class="circle" id="micBtn">🎙️</button>

    <button class="send" id="sendBtn">➤</button>

  </div>

</div>

</div>


<input
  type="file"
  id="fileInput"
  accept="image/*,.pdf,.txt,.md,.csv,.json"
  hidden
>

<input
  type="file"
  id="cameraInput"
  accept="image/*"
  capture="environment"
  hidden
>

<div class="toast" id="toast"></div>


<script>

const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");

const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");

const plusBtn = document.getElementById("plusBtn");
const attachMenu = document.getElementById("attachMenu");

const fileInput = document.getElementById("fileInput");
const cameraInput = document.getElementById("cameraInput");

const statusEl = document.getElementById("status");
const toast = document.getElementById("toast");

const clearBtn = document.getElementById("clearBtn");
const language = document.getElementById("language");

let messages = [];
let attachments = [];


// -------------------------
// UI
// -------------------------

function showToast(text){

  toast.textContent = text;
  toast.style.display = "block";

  setTimeout(()=>{
    toast.style.display = "none";
  },2500);
}


function status(text){
  statusEl.textContent = text || "";
}


function scrollBottom(){

  requestAnimationFrame(()=>{
    chat.scrollTop = chat.scrollHeight;
  });

}


function addMessage(text, type, sources = []){

  const div = document.createElement("div");

  div.className = "msg " + type;

  div.textContent = text;

  if(sources && sources.length){

    const sourceBox =
      document.createElement("div");

    sourceBox.className = "sources";

    const heading =
      document.createElement("div");

    heading.textContent = "🌐 Sources";

    sourceBox.appendChild(heading);

    sources.forEach(source => {

      if(!source.uri) return;

      const a =
        document.createElement("a");

      a.href = source.uri;

      a.target = "_blank";

      a.rel = "noopener noreferrer";

      a.textContent =
        source.title || source.uri;

      sourceBox.appendChild(a);

    });

    div.appendChild(sourceBox);
  }

  chat.appendChild(div);

  scrollBottom();

  return div;
}


function addTyping(){

  const div =
    document.createElement("div");

  div.className = "msg ai";

  div.id = "typing";

  div.innerHTML = `
    <span class="typing">
      <span></span>
      <span></span>
      <span></span>
    </span>
  `;

  chat.appendChild(div);

  scrollBottom();
}


function removeTyping(){

  const t =
    document.getElementById("typing");

  if(t) t.remove();

}


// -------------------------
// SEND MESSAGE
// -------------------------

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text && !attachments.length){
    return;
  }

  welcome.style.display = "none";

  addMessage(
    text || "📎 Attachment",
    "user"
  );

  messages.push({
    role:"user",
    text:text,
    attachments:attachments
  });

  input.value = "";

  input.style.height = "auto";

  const currentAttachments =
    attachments;

  attachments = [];

  attachMenu.style.display = "none";

  status("Guru AI सोच रहा है...");

  addTyping();

  sendBtn.disabled = true;

  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          messages:messages,

          enableSearch:true,

          language:
            language.value

        })

      });


    const data =
      await response.json();


    removeTyping();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Request failed"
      );

    }


    const answer =
      data.text ||
      "कोई उत्तर नहीं मिला।";


    addMessage(
      answer,
      "ai",
      data.sources || []
    );


    messages.push({
      role:"assistant",
      text:answer
    });


    if(data.model){

      status(
        "Active model: " +
        data.model
      );

    }else{

      status("");

    }


  }catch(error){

    removeTyping();

    addMessage(
      "⚠️ अभी जवाब नहीं मिला।\n\n" +
      error.message +
      "\n\nथोड़ी देर बाद फिर कोशिश करें।",
      "ai"
    );

    status(
      "Connection / API limit"
    );

  }finally{

    sendBtn.disabled = false;

  }

}


// -------------------------
// ENTER
// -------------------------

input.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      sendMessage();

    }

  }
);


// -------------------------
// AUTO RESIZE
// -------------------------

input.addEventListener(
  "input",
  function(){

    this.style.height =
      "auto";

    this.style.height =
      Math.min(
        this.scrollHeight,
        130
      ) + "px";

  }
);


// -------------------------
// SEND BUTTON
// -------------------------

sendBtn.addEventListener(
  "click",
  sendMessage
);


// -------------------------
// ATTACH MENU
// -------------------------

plusBtn.addEventListener(
  "click",
  function(){

    attachMenu.style.display =
      attachMenu.style.display === "block"
        ? "none"
        : "block";

  }
);


// -------------------------
// FILE UPLOAD
// -------------------------

document.getElementById(
  "fileBtn"
).addEventListener(
  "click",
  function(){

    attachMenu.style.display =
      "none";

    fileInput.click();

  }
);


// -------------------------
// GALLERY
// -------------------------

document.getElementById(
  "galleryBtn"
).addEventListener(
  "click",
  function(){

    attachMenu.style.display =
      "none";

    fileInput.click();

  }
);


// -------------------------
// CAMERA
// -------------------------

document.getElementById(
  "cameraBtn"
).addEventListener(
  "click",
  function(){

    attachMenu.style.display =
      "none";

    cameraInput.click();

  }
);


// -------------------------
// READ FILE
// -------------------------

function readFile(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        () => reject(
          new Error(
            "File read failed"
          )
        );

      reader.readAsDataURL(file);

    }
  );

}


async function handleFile(file){

  if(!file) return;

  status(
    "File तैयार हो रही है..."
  );

  try{

    const data =
      await readFile(file);

    attachments.push({

      mimeType:
        file.type ||
        "application/octet-stream",

      data:data

    });

    showToast(
      "📎 File तैयार है — अब भेजें"
    );

    status(
      file.name || "Attachment ready"
    );

  }catch(error){

    showToast(
      "File पढ़ने में समस्या"
    );

    status("");

  }

}


fileInput.addEventListener(
  "change",
  async function(){

    const file =
      this.files?.[0];

    await handleFile(file);

    this.value = "";

  }
);


cameraInput.addEventListener(
  "change",
  async function(){

    const file =
      this.files?.[0];

    await handleFile(file);

    this.value = "";

  }
);


// -------------------------
// VOICE INPUT
// -------------------------

micBtn.addEventListener(
  "click",
  function(){

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if(!SpeechRecognition){

      showToast(
        "इस browser में Voice Input उपलब्ध नहीं है"
      );

      return;

    }


    const recognition =
      new SpeechRecognition();


    const selected =
      language.value;


    if(selected === "en"){

      recognition.lang =
        "en-IN";

    }else if(
      selected === "es"
    ){

      recognition.lang =
        "es-ES";

    }else{

      recognition.lang =
        "hi-IN";

    }


    recognition.interimResults =
      false;

    recognition.maxAlternatives =
      1;


    status(
      "🎙️ बोलिए..."
    );


    recognition.onresult =
      function(event){

        const spoken =
          event.results[0][0]
            .transcript;

        input.value +=
          spoken + " ";

        input.dispatchEvent(
          new Event("input")
        );

        status(
          "Voice text तैयार है"
        );

      };


    recognition.onerror =
      function(){

        status(
          "Voice input बंद हो गया"
        );

      };


    recognition.onend =
      function(){

        setTimeout(()=>{
          status("");
        },1200);

      };


    recognition.start();

  }
);


// -------------------------
// QUICK QUESTIONS
// -------------------------

document
  .querySelectorAll(".quick button")
  .forEach(button => {

    button.addEventListener(
      "click",
      function(){

        input.value =
          this.dataset.q;

        input.dispatchEvent(
          new Event("input")
        );

        sendMessage();

      }
    );

  });


// -------------------------
// CLEAR CHAT
// -------------------------

clearBtn.addEventListener(
  "click",
  function(){

    messages = [];

    attachments = [];

    chat.innerHTML = "";

    chat.appendChild(
      welcome
    );

    welcome.style.display =
      "block";

    status("");

    showToast(
      "Chat साफ हो गई"
    );

  }
);


// -------------------------
// CLOSE MENU OUTSIDE
// -------------------------

document.addEventListener(
  "click",
  function(e){

    if(
      !attachMenu.contains(e.target) &&
      e.target !== plusBtn
    ){

      attachMenu.style.display =
        "none";

    }

  }
);

</script>

</body>
</html>
